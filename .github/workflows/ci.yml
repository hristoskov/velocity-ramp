name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (GCC 16)
          - os: macos-latest
            name: macOS (AppleClang)
          - os: windows-latest
            name: Windows (MSVC)
    env:
      CPPMODEL_USERNAME: ${{ secrets.CPPMODEL_USERNAME }}
      CPPMODEL_PASSWORD: ${{ secrets.CPPMODEL_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # Linux ships an older default GCC; pull in the latest supported
      # version (matching the "gcc16" archive from download.cppmodel.com)
      # from the well-known toolchain PPA.
      - name: Install GCC 16 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16
          echo "CC=gcc-16" >> "$GITHUB_ENV"
          echo "CXX=g++-16" >> "$GITHUB_ENV"

      - name: Fetch CppModel dependencies (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/update-cppmodel.sh
        env:
          COMPILER: gcc16

      - name: Fetch CppModel dependencies (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/update-cppmodel.sh

      - name: Fetch CppModel dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\update-cppmodel.ps1 -Platform MSVC

      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -C RelWithDebInfo
